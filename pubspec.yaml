name: ficha_pet
description: Aplicación móvil para gestión de salud de mascotas
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI y diseño
  cupertino_icons: ^1.0.6
  
  # Estado y almacenamiento
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Manejo de imágenes y archivos
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path: ^1.8.3
  
  # Base de datos local
  sqflite: ^2.3.0
  
  # Gráficos
  fl_chart: ^0.65.0
  
  # PDF y exportación
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # QR codes
  qr_flutter: ^4.1.0
  
  # Utilidades
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  


