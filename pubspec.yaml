name: ficha_pet
description: Aplicación multiplataforma para gestión de salud y recordatorios de mascotas
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI y diseño Material You
  cupertino_icons: ^1.0.6

  # Estado, red y almacenamiento
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: any
  crypto: any

  # Manejo de imágenes y archivos
  image_picker: ^1.0.7

  # Gráficos
  fl_chart: ^0.65.0

  # PDF y exportación
  pdf: ^3.10.7
  printing: ^5.12.0

  # QR codes
  qr_flutter: ^4.1.0

  # Utilidades
  intl: any
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
